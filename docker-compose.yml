version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: case_management_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: case_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - case-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: case_management_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - case-management-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: case_management_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/case_management_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      REDIS_URL: redis://redis:6379
      # Email configuration
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password
      EMAIL_FROM: your-email@gmail.com
      # File upload
      UPLOAD_DEST: /app/uploads
      MAX_FILE_SIZE: 10485760
      # CORS
      CORS_ORIGIN: http://localhost:3000
      # MinIO Configuration
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_USE_SSL: false
      MINIO_BUCKET: case-management
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - case-management-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: case_management_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - case-management-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Database Migration Service (runs once)
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: case_management_migration
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/case_management_db
    command: ["sh", "-c", "sleep 10 && npx prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - case-management-network
    restart: "no"

  # Database Seeder Service (runs once)
  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: case_management_seeder
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/case_management_db
    command: ["sh", "-c", "sleep 15 && npx prisma db seed"]
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - case-management-network
    restart: "no"

  # 可选：添加 pgAdmin 用于数据库管理
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: case_management_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - case-management-network

  # MinIO 对象存储服务 (本地模拟 S3)
  minio:
    image: minio/minio:latest
    container_name: case_management_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"    # API端口
      - "9001:9001"    # 控制台端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - case-management-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

# Network configuration
networks:
  case-management-network:
    driver: bridge

# Volume configuration
volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  redis_data: